<!doctype html>
<html>
<head>
  <title>Settings</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="show-task">
  <h2>Settings</h2>

  <form method="POST" action="/settings">
    <p>College:</p>
    <input type="text" name="college" value="{{ user.get('college', '') }}" required>

    <p>Major:</p>
    <input type="text" name="major" value="{{ user.get('major', '') }}" required>

    <p>Year:</p>
    <input type="text" name="year" value="{{ user.get('year', '') }}" required>

    <br><br>
    <button type="submit">Save</button>
  </form>

  <br>
  <a href="/">Back</a>
</div>

</body>
</html>
